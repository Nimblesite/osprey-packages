# Implements [PACKAGE-HOSTED-SPEND-CAP]: the hard stop behind the project budget. Every budget
# notification (Pub/Sub → Eventarc) runs this; once the month's cost reaches the budget it unlinks
# billing from the project, which stops every paid GCP resource in it. Relink billing to recover.
main:
  params: [event]
  steps:
    - decode:
        assign:
          - notification: ${json.decode(base64.decode(event.data.message.data))}
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
    - check:
        switch:
          - condition: ${notification.costAmount >= notification.budgetAmount}
            next: alert
        next: end
    - alert:
        call: sys.log
        args:
          severity: ALERT
          text: '${"spend cap hit, unlinking billing from " + project + ": " + json.encode_to_string(notification)}'
    - unlink:
        call: http.put
        args:
          url: ${"https://cloudbilling.googleapis.com/v1/projects/" + project + "/billingInfo"}
          auth:
            type: OAuth2
          body:
            billingAccountName: ""
