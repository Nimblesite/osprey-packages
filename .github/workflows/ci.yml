name: CI

# The package manager builds with the released Osprey toolchain at the tag pinned in scripts/osprey-toolchain.sh
# (make _toolchain lays it into target/osprey) [REPO-SPLIT]. Phase 1 builds the package client and
# the hosted fixtures once; phase 2 runs every suite on those artifacts; phase 3 gates coverage.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # deploy.yml reruns the whole suite at the exact SHA it deploys [PACKAGE-HOSTED-RELEASE].
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - &checkout
        uses: actions/checkout@v7
      - name: Registry CI and make contracts
        run: node --test scripts/ci/ci-registry-contract-tests.mjs
      - &toolchain
        name: The pinned Osprey toolchain
        run: make _toolchain
      - uses: ./.github/actions/setup-wasm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Deploy script lint and Terraform validation (no state backend)
        run: make _registry-infra-check
      - name: Build the package client, the hosted fixture site and the pinned migration tool
        run: make build _registry-website-fixture _registry-migration-tool
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            target/osprey-pkg
            target/registry-site-build/hosted-fixture/
            target/registry-tools/*/bin/
          retention-days: 1
          if-no-files-found: error

  test:
    name: "Tests: package manager (${{ matrix.memory }})"
    needs: build
    strategy:
      fail-fast: false
      matrix:
        memory: [gc, arc]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *toolchain
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: target
      - run: chmod +x target/osprey/osprey target/osprey-pkg
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          python-version: "3.12"
          enable-cache: false
      - name: Require Python integration prerequisites
        run: |
          uv --version
          uv python install 3.12
      - name: Package manager security and integration suites
        run: make _test_registry REGISTRY_MEMORY=${{ matrix.memory }} REGISTRY_COVERAGE=target/coverage
      - name: Allocation-free package hashing
        if: matrix.memory == 'gc'
        run: make _package-hashing
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.memory }}
          path: target/coverage/
          retention-days: 1
          if-no-files-found: error

  test-hosted:
    name: "Tests: hosted registry (PostgreSQL and Chromium)"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *toolchain
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: target
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install the locked browser harness
        run: |
          npm ci --prefix scripts
          npx --prefix scripts playwright install --with-deps chromium
      - name: Replay migrations and exercise the packaged catalog and account flows
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          test -x /usr/lib/postgresql/16/bin/postgres
          make _registry-integration-verify REGISTRY_COVERAGE=target/coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-hosted
          path: target/coverage/
          retention-days: 1
          if-no-files-found: error

  # Phase 3: the reports the suites wrote, gated against scripts/coverage-thresholds.json. Runs no test.
  coverage:
    name: Coverage threshold
    needs: [test, test-hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *checkout
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: target/coverage
          merge-multiple: true
      - name: Merged line coverage of this repository's files
        run: node scripts/coverage.mjs . target/coverage/*.json

  # The one required check.
  ci:
    name: CI
    if: always()
    needs: [build, test, test-hosted, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.test-hosted.result }}" = success
          test "${{ needs.coverage.result }}" = success
